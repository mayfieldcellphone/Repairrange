stages:
    - generate
      - deploy
      
      blog_bot:
        stage: generate
          image: python:3.12-slim
            rules:
                - if: '$CI_PIPELINE_SOURCE == "schedule"'
                  variables:
                      SITE_ROOT: "."
                          LLM_PROVIDER: "gemini"
                            before_script:
                                - apt-get update -qq && apt-get install -y -qq git
                                    - git config user.email "bot@repairrange.io"
                                        - git config user.name "blog-bot"
                                          script:
                                              - |
                                                    if [ -n "$SITE_KEY" ]; then
                                                            TARGET_SITE="$SITE_KEY"
                                                                  elif [[ "$CI_PIPELINE_SCHEDULE_DESCRIPTION" == *"RepairRange"* ]]; then
                                                                          TARGET_SITE="repairrange"
                                                                                elif [[ "$CI_PIPELINE_SCHEDULE_DESCRIPTION" == *"PDFRange"* ]]; then
                                                                                        TARGET_SITE="pdfrange"
                                                                                              else
                                                                                                      echo "Error: Cannot determine site. Name your schedule with 'RepairRange' or 'PDFRange'."
                                                                                                              exit 1
                                                                                                                    fi
                                                                                                                          python blog-bot/generate.py --site "$TARGET_SITE"
                                                                                                                              - |
                                                                                                                                    PUSH_TOKEN="${GITLAB_PUSH_TOKEN:-$git_write}"
                                                                                                                                          if [ -n "$(git status --porcelain)" ]; then
                                                                                                                                                  git add -A
                                                                                                                                                          git commit -m "blog-bot: automated post [skip ci]"
                                                                                                                                                                  git push "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
                                                                                                                                                                        else
                                                                                                                                                                                echo "nothing generated — check job log above"
                                                                                                                                                                                        exit 1
                                                                                                                                                                                              fi
                                                                                                                                                                                                artifacts:
                                                                                                                                                                                                    when: always
                                                                                                                                                                                                        paths:
                                                                                                                                                                                                              - blog-bot/topics/*_used.txt
                                                                                                                                                                                                                  expire_in: 30 days
                                                                                                                                                                                                                  
                                                                                                                                                                                                                  generate_news:
                                                                                                                                                                                                                    stage: generate
                                                                                                                                                                                                                      image: python:3.12-slim
                                                                                                                                                                                                                        rules:
                                                                                                                                                                                                                            - if: '$CI_PIPELINE_SOURCE == "schedule" && $JOB == "news"'
                                                                                                                                                                                                                              script:
                                                                                                                                                                                                                                  - |
                                                                                                                                                                                                                                        if [ -z "$GEMINI_API_KEY" ] || [ -z "$GITLAB_TOKEN" ]; then
                                                                                                                                                                                                                                                echo "GEMINI_API_KEY and GITLAB_TOKEN must both be set as CI variables."
                                                                                                                                                                                                                                                        exit 1
                                                                                                                                                                                                                                                              fi
                                                                                                                                                                                                                                                                  - python generate_tech_news.py
                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                  blog_bot_dryrun:
                                                                                                                                                                                                                                                                    stage: generate
                                                                                                                                                                                                                                                                      image: python:3.12-slim
                                                                                                                                                                                                                                                                        rules:
                                                                                                                                                                                                                                                                            - if: '$CI_PIPELINE_SOURCE == "web"'
                                                                                                                                                                                                                                                                                  when: manual
                                                                                                                                                                                                                                                                                        allow_failure: true
                                                                                                                                                                                                                                                                                          variables:
                                                                                                                                                                                                                                                                                              LLM_PROVIDER: "gemini"
                                                                                                                                                                                                                                                                                                script:
                                                                                                                                                                                                                                                                                                    - python blog-bot/generate.py --site "${SITE_KEY:-repairrange}" --dry-run
                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                    pages:
                                                                                                                                                                                                                                                                                                      stage: deploy
                                                                                                                                                                                                                                                                                                        image: debian:stable-slim
                                                                                                                                                                                                                                                                                                          script:
                                                                                                                                                                                                                                                                                                              - apt-get update -qq && apt-get install -y -qq curl python3
                                                                                                                                                                                                                                                                                                                  - python3 generate_sitemap.py
                                                                                                                                                                                                                                                                                                                      - mkdir -p public
                                                                                                                                                                                                                                                                                                                          - cp ./*.html public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                              - cp ./*.txt public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                  - cp ./*.xml public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                      - cp catalog.json public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                          - cp pricing.json public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                              - cp -r fix locations repair brands tools blog unlock css selfrepairkit public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                                  - cp _redirects public/ 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                                      - |
                                                                                                                                                                                                                                                                                                                                                            if grep -rlE 'glpat-[A-Za-z0-9_-]{20}|AIza[A-Za-z0-9_-]{35}|EAA[A-Za-z0-9]{60,}|_token"[[:space:]]*:[[:space:]]*"[^"]{20,}|"private_key"|BEGIN [A-Z ]*PRIVATE KEY' public/ 2>/dev/null; then
                                                                                                                                                                                                                                                                                                                                                                    echo "SECRET DETECTED IN public/ — deploy aborted. Files listed above."
                                                                                                                                                                                                                                                                                                                                                                            exit 1
                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                        echo "secret scan clean"
                                                                                                                                                                                                                                                                                                                                                                                            - ls -R public
                                                                                                                                                                                                                                                                                                                                                                                              artifacts:
                                                                                                                                                                                                                                                                                                                                                                                                  paths:
                                                                                                                                                                                                                                                                                                                                                                                                        - public
                                                                                                                                                                                                                                                                                                                                                                                                          only:
                                                                                                                                                                                                                                                                                                                                                                                                              - main
                                                                                                                                                                                                                                                                                                                                                                                                                  SITE_ROOT: "."
    LLM_PROVIDER: "gemini"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config user.email "bot@repairrange.io"
    - git config user.name "blog-bot"
  script:
    - |
      if [ "$SITE_KEY" != "repairrange" ]; then
        echo "This repo only builds 'repairrange'. Got SITE_KEY='$SITE_KEY'."
        echo "To run PDFRange, copy blog-bot/ into the PDFRange repo and schedule it there."
        exit 1
      fi
    - |
      if [ -z "$GITLAB_PUSH_TOKEN" ]; then
        echo "GITLAB_PUSH_TOKEN is not set. Settings > CI/CD > Variables."
        exit 1
      fi
    - python blog-bot/generate.py --site "$SITE_KEY"
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git commit -m "blog-bot: ${SITE_KEY} post"
        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "nothing generated — check the job log above"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - blog-bot/topics/*_used.txt
    expire_in: 30 days

generate_news:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $JOB == "news"'
  script:
    - |
      if [ -z "$GEMINI_API_KEY" ] || [ -z "$GITLAB_TOKEN" ]; then
        echo "GEMINI_API_KEY and GITLAB_TOKEN must both be set as CI variables."
        exit 1
      fi
    - python generate_tech_news.py

blog_bot_dryrun:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  variables:
    LLM_PROVIDER: "gemini"
  script:
    - python blog-bot/generate.py --site "${SITE_KEY:-repairrange}" --dry-run

pages:
  stage: deploy
  image: debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y -qq curl python3
    - python3 generate_sitemap.py
    - mkdir -p public
    - cp ./*.html public/ 2>/dev/null || true
    - cp ./*.txt public/ 2>/dev/null || true
    - cp ./*.xml public/ 2>/dev/null || true
    - cp catalog.json public/ 2>/dev/null || true
    - cp pricing.json public/ 2>/dev/null || true
    - cp -r fix locations repair brands tools blog unlock css selfrepairkit public/ 2>/dev/null || true
    - cp _redirects public/ 2>/dev/null || true
    - |
      if grep -rlE 'glpat-[A-Za-z0-9_-]{20}|AIza[A-Za-z0-9_-]{35}|EAA[A-Za-z0-9]{60,}|_token"[[:space:]]*:[[:space:]]*"[^"]{20,}|"private_key"|BEGIN [A-Z ]*PRIVATE KEY' public/ 2>/dev/null; then
        echo "SECRET DETECTED IN public/ — deploy aborted. Files listed above."
        exit 1
      fi
      echo "secret scan clean"
    - ls -R public
  artifacts:
    paths:
      - public
  only:
    - main
