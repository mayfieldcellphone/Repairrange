stages:
  - generate
  - deploy

# Runs ONLY from a GitLab pipeline schedule whose Description contains
# "RepairRange" (e.g. "RepairRange Tue"). This GitLab instance's schedule
# editor has no free-form CI variables (only Description/cron/branch/Inputs),
# so routing is done off the schedule Description text instead.
# Never on push, never on MR. See blog-bot/README.md.
#
# NOTE: commit message deliberately has NO "[skip ci]". blog_bot only ever
# runs on a schedule pipeline, so its own push can't re-trigger itself (the
# resulting pipeline's source is "push", which doesn't match this rule) --
# but the push DOES need to trigger a follow-up pipeline so the `pages` job
# deploys the new commit. With [skip ci] the post got committed but the
# GitLab Pages deploy kept serving the pre-push SHA forever.
blog_bot:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /RepairRange/'
  variables:
    SITE_ROOT: "."
    LLM_PROVIDER: "gemini"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config user.email "bot@repairrange.io"
    - git config user.name "blog-bot"
  script:
    - |
      if [ -z "$GITLAB_PUSH_TOKEN" ]; then
        echo "CRITICAL ERROR: GITLAB_PUSH_TOKEN is missing. Check Settings > CI/CD > Variables."
        exit 1
      fi
    - python blog-bot/generate.py --site repairrange
    - find . -name "__pycache__" -type d -prune -exec rm -rf {} +
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git commit -m "blog-bot: repairrange post"
        git pull --rebase "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_DEFAULT_BRANCH}"
        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "nothing generated -- check job log above"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - blog-bot/topics/*_used.txt
    expire_in: 30 days

# Manual dry run: Build > Run pipeline > play this job's Run button.
# No writes, no push, no email -- safe to test the prompt/model any time.
blog_bot_dryrun:
  stage: generate
  image: python:3.12-slim
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    LLM_PROVIDER: "gemini"
  script:
    - python blog-bot/generate.py --site repairrange --dry-run

# Runs ONLY from a schedule whose Description contains "News" (create one in
# Build > Pipeline schedules if/when you want the tech-news job automated;
# none exists today, so this job simply never fires).
generate_news:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /News/'
  script:
    - |
      if [ -z "$GEMINI_API_KEY" ] || [ -z "$GITLAB_TOKEN" ]; then
        echo "GEMINI_API_KEY and GITLAB_TOKEN must both be set as CI variables."
        exit 1
      fi
    - python generate_tech_news.py

pages:
  stage: deploy
  image: debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y -qq curl python3
    - python3 generate_sitemap.py
    - mkdir -p public
    - cp ./*.html public/ 2>/dev/null || true
    - cp ./*.txt public/ 2>/dev/null || true
    - cp ./*.xml public/ 2>/dev/null || true
    - cp catalog.json public/ 2>/dev/null || true
    - cp pricing.json public/ 2>/dev/null || true
    - cp -r fix locations repair brands tools blog unlock css selfrepairkit public/ 2>/dev/null || true
    - cp _redirects public/ 2>/dev/null || true
    - |
      if grep -rlE 'glpat-[A-Za-z0-9_-]{20}|AIza[A-Za-z0-9_-]{35}|EAA[A-Za-z0-9]{60,}|_token"[[:space:]]*:[[:space:]]*"[^"]{20,}|"private_key"|BEGIN [A-Z ]*PRIVATE KEY' public/ 2>/dev/null; then
        echo "SECRET DETECTED IN public/ -- deploy aborted."
        exit 1
      fi
    - ls -R public
  artifacts:
    paths:
      - public
  only:
    - main
