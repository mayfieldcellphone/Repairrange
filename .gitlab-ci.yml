stages:
  - build
  - deploy

generate_news:
  stage: build
  image: python:3.9-slim
  script:
    - python generate_tech_news.py
    - python generate_mayfield_rss.py
  only:
    - schedules

pages:
  stage: deploy
  image: node:18-alpine
  script:
    - npm install -g @tailwindcss/cli
    - mkdir -p css
    - echo "@import 'tailwindcss';" > css/input.css
    - echo "@source './**/*.html';" >> css/input.css
    - tailwindcss -i css/input.css -o css/style.css --minify
    - mkdir -p public
    - cp -r ./*.html ./*.txt ./*.xml public/ 2>/dev/null || true
    - cp -r fix locations repair brands tools blog css public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  only:
    - main
