image: python:3.12-slim

stages:
  - generate
  - deploy

# Generates a RepairRange blog post. Runs ONLY from a pipeline schedule
# (Build > Pipeline schedules). Site hardcoded -- this GitLab instance's
# schedule editor can't set CI variables, so no $SITE_KEY. No [skip ci] on
# the commit: the push must trigger a follow-up pipeline so `pages` redeploys
# (repairrange is served off GitLab Pages, unlike pdfrange's VPS git-poll).
blog_bot:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    SITE_ROOT: "."
    LLM_PROVIDER: "gemini"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config user.email "bot@repairrange.io"
    - git config user.name "blog-bot"
  script:
    - |
      if [ -z "$GITLAB_PUSH_TOKEN" ]; then
        echo "CRITICAL ERROR: GITLAB_PUSH_TOKEN is missing. Check Settings > CI/CD > Variables."
        exit 1
      fi
    - python blog-bot/generate.py --site repairrange
    - find . -name "__pycache__" -type d -prune -exec rm -rf {} +
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git commit -m "blog-bot: repairrange post"
        git pull --rebase "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_DEFAULT_BRANCH}"
        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "nothing generated -- check job log above"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - blog-bot/topics/*_used.txt
    expire_in: 30 days

# Manual dry run: Build > Run pipeline > play this job. No writes, no email.
blog_bot_dryrun:
  stage: generate
  image: python:3.12-slim
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    LLM_PROVIDER: "gemini"
  script:
    - python blog-bot/generate.py --site repairrange --dry-run

pages:
  stage: deploy
  script:
    # Regenerate sitemap from the real files (stdlib only, no installs)
    - python generate_sitemap.py || true
    # Assemble the deploy
    - mkdir -p public
    - cp *.html public/ 2>/dev/null || true
    - cp *.txt public/ 2>/dev/null || true
    - cp *.xml public/ 2>/dev/null || true
    - cp _redirects public/ 2>/dev/null || true
    - cp catalog.json pricing.json public/ 2>/dev/null || true
    - cp smart_widget.js u.js public/ 2>/dev/null || true
    - cp *.jpg *.jpeg *.png *.svg *.webp *.ico public/ 2>/dev/null || true
    # All content folders (allowlist keeps internal scripts/docs/data private)
    # NOTE: 'assets' restored to deploy the logo + OG image; 'selfrepairkit' restored to fix its 404s
    - for d in css js assets blog brands repair unlock locations fix guides news tools downloads selfrepairkit; do cp -r "$d" public/ 2>/dev/null || true; done
  artifacts:
    paths:
      - public
  only:
    - main
