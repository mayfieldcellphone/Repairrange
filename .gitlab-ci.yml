stages:
  - generate
  - deploy

blog_bot:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    SITE_ROOT: "."
    LLM_PROVIDER: "gemini"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config user.email "bot@repairrange.io"
    - git config user.name "blog-bot"
  script:
    - |
      echo "--- Checking Token Presence ---"
      if [ -z "$GITLAB_PUSH_TOKEN" ]; then
        echo "CRITICAL ERROR: GITLAB_PUSH_TOKEN is NOT found in the environment."
        echo "The robot cannot save files without this key."
        exit 1
      fi
      echo "Token found. Proceeding with generation..."
    - |
      if [[ "$CI_PIPELINE_SCHEDULE_DESCRIPTION" == *"RepairRange"* ]]; then
        TARGET_SITE="repairrange"
      elif [[ "$CI_PIPELINE_SCHEDULE_DESCRIPTION" == *"PDFRange"* ]]; then
        TARGET_SITE="pdfrange"
      else
        echo "Error: Cannot determine site. Name your schedule with 'RepairRange' or 'PDFRange'."
        exit 1
      fi
      python blog-bot/generate.py --site "$TARGET_SITE"
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git commit -m "blog-bot: automated post"
        git pull --rebase https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git ${CI_DEFAULT_BRANCH}; git push https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "nothing generated — check job log above"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - blog-bot/topics/*_used.txt
    expire_in: 30 days

generate_news:
  stage: generate
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $JOB == "news"'
  script:
    - |
      if [ -z "$GEMINI_API_KEY" ] || [ -z "$GITLAB_TOKEN" ]; then
        echo "GEMINI_API_KEY and GITLAB_TOKEN must both be set as CI variables."
        exit 1
      fi
    - python generate_tech_news.py

pages:
  stage: deploy
  image: debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y -qq curl python3
    - python3 generate_sitemap.py
    - mkdir -p public
    - cp ./*.html public/ 2>/dev/null || true
    - cp ./*.txt public/ 2>/dev/null || true
    - cp ./*.xml public/ 2>/dev/null || true
    - cp catalog.json public/ 2>/dev/null || true
    - cp pricing.json public/ 2>/dev/null || true
    - cp -r fix locations repair brands tools blog unlock css selfrepairkit public/ 2>/dev/null || true
    - cp _redirects public/ 2>/dev/null || true
    - |
      if grep -rlE 'glpat-[A-Za-z0-9_-]{20}|AIza[A-Za-z0-9_-]{35}|EAA[A-Za-z0-9]{60,}|_token"[[:space:]]*:[[:space:]]*"[^"]{20,}|"private_key"|BEGIN [A-Z ]*PRIVATE KEY' public/ 2>/dev/null; then
        echo "SECRET DETECTED IN public/ — deploy aborted."
        exit 1
      fi
    - ls -R public
  artifacts:
    paths:
      - public
  only:
    - main


