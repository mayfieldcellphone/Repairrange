stages:
  - build
  - deploy

generate_news:
  stage: build
  image: python:3.9-slim
  script:
    - python generate_tech_news.py
    - python generate_mayfield_rss.py
  only:
    - schedules

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r ./*.html ./*.txt ./*.xml public/ 2>/dev/null || true
    - cp -r fix locations repair brands tools blog public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  only:
    - main
