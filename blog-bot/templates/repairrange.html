<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | RepairRange</title>
<meta name="description" content="{{META}}">
<link rel="canonical" href="{{DOMAIN}}/blog/{{SLUG}}.html">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META}}">
<meta property="og:url" content="{{DOMAIN}}/blog/{{SLUG}}.html">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BlogPosting",
"headline":"{{TITLE}}","description":"{{META}}",
"datePublished":"{{DATE_ISO}}","dateModified":"{{DATE_ISO}}",
"mainEntityOfPage":{"@type":"WebPage","@id":"{{DOMAIN}}/blog/{{SLUG}}.html"},
"publisher":{"@type":"Organization","name":"RepairRange","url":"{{DOMAIN}}"},
"author":{"@type":"Organization","name":"RepairRange"}}
</script>
<style>
:root{--teal:#0c4a45;--amber:#F59E0B;--ink:#1a1a1a;--muted:#5c6a68;--line:#e4e9e8}
*{box-sizing:border-box}
body{margin:0;background:#fdfdfc;color:var(--ink);font:400 17px/1.7 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header,footer{background:var(--teal);color:#fff}
header{padding:18px 24px}
header a{color:#fff;text-decoration:none;font:700 19px/1 Fraunces,Georgia,serif}
main{max-width:720px;margin:0 auto;padding:48px 24px 64px}
.date{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h1{font:700 clamp(30px,5vw,42px)/1.2 Fraunces,Georgia,serif;color:var(--teal);margin:10px 0 28px;letter-spacing:-.01em}
h2{font:600 26px/1.3 Fraunces,Georgia,serif;color:var(--teal);margin:44px 0 12px}
h3{font:600 20px/1.35 Inter,sans-serif;margin:28px 0 8px}
p,li{color:#2c3533}
a{color:var(--teal);text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px;text-underline-offset:3px}
ul,ol{padding-left:22px}
li{margin:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:40px 0}
.cta{background:#f4f8f7;border-left:3px solid var(--amber);padding:18px 20px;border-radius:0 8px 8px 0;margin:40px 0}
.cta a{font-weight:600}
footer{padding:28px 24px;font-size:14px;text-align:center}
footer a{color:var(--amber)}
</style>
</head>
<body>
<header><a href="{{DOMAIN}}">RepairRange</a></header>
<main>
  <div class="date">{{DATE_HUMAN}}</div>
  {{BODY}}
  <div class="cta">
    Working out what a repair should cost?
    <a href="{{DOMAIN}}/calculator.html">Use the RepairRange calculator</a> to see the range for your model.
  </div>
</main>
<footer>RepairRange &middot; <a href="mailto:info@repairrange.io">info@repairrange.io</a></footer>
</body>
</html>
